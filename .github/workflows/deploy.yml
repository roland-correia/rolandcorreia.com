name: Build and deploy

# Every pull request builds the site (so a broken story or type error shows up
# before merging). Only a push to main also deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/diluted-stories/package-lock.json

      - name: Install dependencies
        working-directory: apps/diluted-stories
        run: npm ci

      - name: Type-check
        working-directory: apps/diluted-stories
        run: npm run check

      - name: Build Diluted Stories
        working-directory: apps/diluted-stories
        run: npm run build

      # The portfolio at the repo root is plain HTML, so it is copied as it is.
      # The built Diluted Stories site goes under /projects/diluted-stories/.
      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='apps' \
            --exclude='node_modules' --exclude='_site' \
            ./ _site/
          mkdir -p _site/projects/diluted-stories
          cp -R apps/diluted-stories/dist/. _site/projects/diluted-stories/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

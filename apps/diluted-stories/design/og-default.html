<!doctype html>
<meta charset="utf-8" />
<title>Diluted Stories share image</title>
<!--
  Source for public/og-default.png (1200x630, the size link previews use).
  To regenerate it, run from apps/diluted-stories:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1200,630 --screenshot=public/og-default.png "file://$PWD/design/og-default.html"
-->
<style>
  @font-face {
    font-family: 'Lexend Variable';
    src: url('../node_modules/@fontsource-variable/lexend/files/lexend-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; padding: 76px 84px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #2438ff; color: #ffffff; font-family: 'Lexend Variable', system-ui, sans-serif;
  }
  .wm { font-size: 200px; line-height: 1; letter-spacing: -0.01em; }
  .wm span { font-weight: var(--w); }
  .tag { font-size: 50px; font-weight: 700; line-height: 1.2; }
  .sub { font-size: 30px; font-weight: 400; line-height: 1.4; margin-top: 12px; }
</style>

<div class="card">
  <div class="wm" aria-hidden="true">
    <span style="--w: 900">D</span><span style="--w: 830">i</span><span style="--w: 750">l</span><span style="--w: 670">u</span><span style="--w: 580">t</span><span style="--w: 480">e</span><span style="--w: 380">d</span>
  </div>
  <div>
    <p class="tag">Research, diluted.</p>
    <p class="sub">Tech and money research, one card at a time.</p>
  </div>
</div>

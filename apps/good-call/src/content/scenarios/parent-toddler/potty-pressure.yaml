set: parent-toddler
category: growing
order: 1
title: Still in nappies?
topic: Potty training
draft: false

situation: |
  Your son Arjun is two and a half. He shows no interest in the potty and gets upset when you suggest it. Your mother-in-law keeps saying that all her children were dry by two, and that you are leaving it too late.

  Nursery have said they are happy to support whenever you start.

question: What is the best call?

options:
  - text: Start strict training this week, with no nappies at all, to get it done.
    call: risky
    why: >-
      Pushing a child who is not ready usually leads to more accidents, more upset and a longer process.
      Some children even start holding in their poo, which can cause constipation. Readiness matters more than age.

  - text: Watch for signs he is ready, such as telling you when he has a wet or dirty nappy, or staying dry for a couple of hours. Start then, with nursery.
    call: best
    why: >-
      Most children are ready somewhere between two and three, and some later. Starting when he shows the
      signs, and doing it the same way as nursery, tends to be quicker and calmer for everyone.

  - text: Leave it completely until he asks to use the toilet himself.
    call: okay
    why: >-
      Waiting for readiness is right, but some children need a gentle nudge once they are ready. Keep a potty
      around, talk about it, let him see others use the toilet, and offer, without pushing.

  - text: Offer him sweets every time he sits on the potty.
    call: okay
    why: >-
      Rewards can help, and stickers work for many children. But if he is not ready, a reward will not make
      him ready, and sweets can turn the toilet into a bargaining game. Save rewards for when he is trying.

principle: >-
  Children are ready for the potty when they are ready, not by a date on the calendar. Look for the signs,
  start calmly, and expect accidents. They are part of learning.

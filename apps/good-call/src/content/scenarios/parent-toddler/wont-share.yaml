set: parent-toddler
category: values
order: 2
title: Mine!
topic: Sharing and turns
draft: false

situation: |
  At a play date, your two-year-old, Amelia, will not let her friend touch any of her toys. She snatches everything back, shouting "Mine!" The other parent is watching.

question: What is the best call?

options:
  - text: Take the toy off Amelia and give it to her friend, to teach her to share.
    call: okay
    why: >-
      You want her to learn to share, which is right. But taking her toy away often teaches that the bigger
      person gets the toy, not that sharing feels good. Most two-year-olds are not yet able to share willingly.

  - text: Help them take turns. "It's your turn now, then it's Zara's turn." Use a timer if it helps, and praise any moment of sharing.
    call: best
    why: >-
      Turn-taking is a step towards sharing that toddlers can manage. A clear, fair system with your help is
      how they learn. Putting away one or two special toys before a play date can also prevent battles.

  - text: Tell her she is being selfish and naughty.
    call: risky
    why: >-
      At two, not wanting to share is normal development, not selfishness. Labels like "naughty" can stick,
      and do not teach her what to do instead. Show her how turns work.

  - text: Let her keep everything to avoid a scene.
    call: okay
    why: >-
      Keeping the peace is tempting, and sometimes fine. But she misses a chance to practise, and her friend
      has nothing to play with. Gentle help with taking turns works better.

principle: >-
  Toddlers are not yet able to share willingly. Teach turn-taking first, with your help, and praise kindness
  when you see it. Generosity grows with age and practice.

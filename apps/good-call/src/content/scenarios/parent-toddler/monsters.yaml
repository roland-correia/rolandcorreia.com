set: parent-toddler
category: feelings
order: 3
title: There's a monster
topic: Fears
draft: false

situation: |
  Your three-year-old, Max, has started screaming at bedtime because he says there is a monster in his wardrobe. He will not stay in his bed, and bedtime now takes two hours.

question: What is the best call?

options:
  - text: Tell him monsters are not real and he needs to stop being silly.
    call: okay
    why: >-
      Monsters are not real, and it is fine to say so. But at three, fears feel completely real, and being
      called silly can make him less likely to tell you about worries. Take the feeling seriously.

  - text: Take his fear seriously. "That sounds scary. I'm here and you're safe." Keep a calm bedtime routine, add a night light, and check on him briefly.
    call: best
    why: >-
      Fears of the dark and monsters are very common at this age, as imagination grows. Acknowledging the
      feeling, plus a predictable routine and a little reassurance, helps it pass without long battles.

  - text: Let him sleep in your bed every night from now on.
    call: okay
    why: >-
      Some families choose to share a bed, and that is up to you. But if you do not want it long term,
      starting it as a fix for fear can be hard to undo. Reassurance in his own room often works.

  - text: Spray "monster spray" every night as part of the routine.
    call: okay
    why: >-
      Many parents find a playful ritual helps, and it can work. It is fine to try. Just make sure it sits
      alongside reassurance, so he learns he can cope with fears, not only that they need spraying.

principle: >-
  Young children's fears feel completely real to them. Take the feeling seriously, stay calm and reassuring,
  and keep the routine predictable. Most fears fade with time.

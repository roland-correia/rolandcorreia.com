set: parent-toddler
category: safety
order: 1
title: The missing battery
topic: Hidden dangers at home
draft: false

situation: |
  Your 18-month-old, Grace, has been playing quietly with the TV remote. You notice the battery cover is off and one of the small round button batteries is missing. You cannot find it anywhere.

  Grace seems completely fine.

question: What is the best call?

options:
  - text: Keep searching the room. If you cannot find it, watch her for symptoms.
    call: risky
    why: >-
      A swallowed button battery can burn through a child's food pipe within hours, and there may be no
      symptoms at first. Waiting to see whether she seems unwell is waiting too long.

  - text: Go to A&E straight away, or call 999, and tell them she may have swallowed a button battery. Take the remote with you.
    call: best
    why: >-
      Child safety experts are clear: if you think a child may have swallowed a button battery, go straight to
      A&E. If it turns up under the sofa later, you have lost an afternoon. Taking the remote shows them the battery type.

  - text: Give her something to eat or drink to help it pass.
    call: risky
    why: >-
      Do not give food or drink, or try to make her sick, unless a doctor tells you to. Doctors may need to act
      quickly, and this can make that harder. Get her to hospital.

  - text: Call your partner to ask what they think.
    call: okay
    why: >-
      It is natural to want a second opinion. But every minute counts with a button battery, and the answer
      will be the same: go now. Call them on the way.

principle: >-
  Button batteries, medicines, magnets and hot drinks: up high and out of reach, with remote and toy battery
  covers taped or screwed shut. If a button battery might have been swallowed, go to A&E immediately.

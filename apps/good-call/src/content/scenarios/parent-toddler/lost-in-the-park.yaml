set: parent-toddler
category: safety
order: 2
title: Gone in a second
topic: Crowds and wandering
draft: false

situation: |
  You are at a busy summer festival with your two-and-a-half-year-old, Leo. You look down at your phone to check the map, and when you look up, he has gone.

question: What is the best call?

options:
  - text: Shout his name, then immediately tell the nearest staff or security, and search in widening circles from where you last saw him. Call 999 if you cannot find him quickly.
    call: best
    why: >-
      Raising the alarm fast is what matters most. Staff can alert others and watch the exits. Most lost
      children are found within minutes, very close by, and the more people looking, the faster that happens.

  - text: Search on your own first, so you do not cause a fuss.
    call: risky
    why: >-
      Embarrassment costs time, and time matters with a missing toddler near crowds, roads or water. Staff
      deal with lost children all the time. Tell them straight away.

  - text: Stay exactly where you are and wait for him to come back.
    call: okay
    why: >-
      Staying near where you lost him can help, especially if a partner or friend searches. But a two-year-old
      may not find his way back. Shout, alert staff and search close by, all at once if you can.

  - text: Post a photo on social media asking people to look.
    call: okay
    why: >-
      It may help later, but in the first minutes, staff on the ground can do far more. Tell them first. Next
      time, take a photo of him that day, so you can show exactly what he is wearing.

principle: >-
  In crowds, keep small children within reach and put your phone away. If they go missing, raise the alarm
  straight away with staff, and search from where you last saw them.

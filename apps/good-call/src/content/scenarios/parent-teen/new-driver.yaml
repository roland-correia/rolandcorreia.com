set: parent-teen
category: safety
order: 3
title: A lift from a new driver
topic: Cars and friends
draft: false

situation: |
  Your seventeen-year-old, Mason, wants to get a lift to a party with his friend Kyle, who passed his driving test last week. There will be four other friends in the car, and they plan to drive back after midnight.

question: What is the best call?

options:
  - text: Let him go. Kyle passed his test, so he is a legal driver.
    call: okay
    why: >-
      He is legal, but new drivers are much more likely to crash than experienced ones, and the risk goes up
      with a car full of friends and late at night. It is worth talking about how to make it safer.

  - text: Talk it through with Mason. Offer to drive them there, or pick them up later, and make clear he can always call you for a lift instead of getting in a car he does not feel safe in.
    call: best
    why: >-
      You are reducing the riskiest part, the late drive home, without banning his social life. The promise
      of a lift with no questions means he never has to choose between looking uncool and staying safe.

  - text: Forbid him from ever getting in a car with friends.
    call: okay
    why: >-
      You are right to be worried, but a ban he will not keep can lead him to go anyway, without telling you.
      Offering lifts and agreeing rules is more likely to work.

  - text: Tell him to make sure Kyle does not drink.
    call: okay
    why: >-
      That matters a great deal, and he should never get in a car with someone who has drunk or taken drugs.
      But it is only one of the risks. Late night and a full car of friends add more.

principle: >-
  Be the lift they can always call. Talk through risks with teenagers instead of only setting rules, and
  make it easy for them to choose safety without losing face.

set: parent-teen
category: growing
order: 3
title: Not the plan you had
topic: Their future
draft: false

situation: |
  You have always hoped your seventeen-year-old, Adaeze, would go to university, as you did. She tells you she wants to do an apprenticeship in electrical engineering instead, and start earning.

  You feel disappointed, and worried.

question: What is the best call?

options:
  - text: Tell her she is throwing her future away.
    call: risky
    why: >-
      Apprenticeships are a respected route into many careers, and she has clearly thought about it. Dismissing
      her plan can push her away, or make her doubt a good decision.

  - text: >-
      Ask her about it with real curiosity: what draws her to it, what the route looks like and what she
      wants long term. Share any worries honestly, then support her choice.
    call: best
    why: >-
      Curious questions help her think it through, and show you take her seriously. Your worries are worth
      sharing once, calmly. In the end, it is her life, and your support will matter more than your plan.

  - text: Agree straight away to keep the peace, but keep hinting about university.
    call: okay
    why: >-
      Avoiding a row is understandable. But hints over months can feel like disapproval that never ends. Say
      what you think once, honestly, and then back her.

  - text: Refuse to help her financially unless she goes to university.
    call: risky
    why: >-
      Using money to control a near-adult's career choice can damage your relationship for years. She may go
      ahead anyway, without you. Support is more powerful than pressure.

principle: >-
  As children grow up, their future becomes theirs to choose. Ask with curiosity, share your view once, and
  then support them. A good relationship outlasts any single decision.

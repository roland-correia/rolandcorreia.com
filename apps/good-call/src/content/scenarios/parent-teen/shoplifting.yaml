set: parent-teen
category: values
order: 2
title: The call from the shop
topic: Getting in trouble
draft: false

situation: |
  A shop phones you. Your fourteen-year-old, Riley, has been caught with friends trying to leave with make-up they had not paid for. The shop has not called the police, but wants you to come and collect him.

question: What is the best call?

options:
  - text: >-
      Collect him, stay calm in the shop, and talk properly once you are home: what happened, why, and how he
      will put it right, such as apologising and paying for anything damaged.
    call: best
    why: >-
      Calm in public, serious at home. Understanding why, such as dares, pressure from friends or wanting to
      fit in, tells you what to tackle. Putting it right himself is a consequence that teaches responsibility.

  - text: Shout at him in front of the staff and his friends.
    call: okay
    why: >-
      Your anger is completely understandable. But a public row tends to make teenagers defensive and
      embarrassed rather than sorry. The conversation that changes things happens later, at home.

  - text: Tell the shop it must be a misunderstanding.
    call: risky
    why: >-
      Defending him without knowing the facts teaches him that you will cover for him. Teenagers learn from
      facing the consequences of their choices, with your support.

  - text: Ban him from seeing those friends ever again.
    call: okay
    why: >-
      Peer pressure may well have played a part, and it is fair to talk about who he spends time with. But a
      total ban rarely works with teenagers, and it puts the blame on others instead of his own choice.

principle: >-
  When teenagers get into trouble, stay calm in the moment, then take it seriously in private. Find out why,
  and help them put it right. Responsibility is learned by taking it.

set: parent-teen
order: 6
title: Their phone is right there
topic: Privacy and trust
draft: false

situation: |
  Your sixteen-year-old, Zara, has seemed withdrawn for a few weeks. Her phone is on the kitchen table, unlocked. You are tempted to read her messages to find out what is wrong.

  You have no specific sign that she is in danger.

question: What is the best call?

options:
  - text: Read her messages. You are her parent, and you have a right to know.
    call: okay
    why: >-
      Your worry is real, and there are times when checking is right, if you believe she is at serious risk.
      But without that, reading her messages secretly can badly damage trust if she finds out. Talk to her first.

  - text: Leave the phone. Find a relaxed moment, such as in the car or while cooking, and tell her you have noticed she seems down and you are there for her.
    call: best
    why: >-
      Side-by-side moments, without eye contact, often make it easier for teenagers to talk. Even if she does
      not open up today, she knows the door is open. If you ever do need to check, tell her why.

  - text: Ask her friends' parents what is going on.
    call: okay
    why: >-
      They may know something useful, and sometimes this helps. But it can feel like going behind her back.
      Start with her, and keep others for if you are seriously worried.

  - text: Leave it. Teenagers are moody, and it will pass.
    call: risky
    why: >-
      Moods are normal, but several weeks of withdrawal deserves attention. It may be nothing, or it may be
      something she needs help with. Asking gently costs nothing.

principle: >-
  Teenagers need privacy, and they need to know you have noticed. Respect their privacy unless their safety
  is at real risk, and if you do check, tell them what you did and why.

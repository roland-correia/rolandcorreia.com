set: parent-teen
category: feelings
order: 3
title: Heartbroken
topic: First relationships
draft: false

situation: |
  Your fifteen-year-old, Jess, has broken up with her first boyfriend after four months. She has been crying in her room for two days and says her life is over.

question: What is the best call?

options:
  - text: Tell her it was only puppy love and she will meet plenty of other people.
    call: risky
    why: >-
      It may be true in the long run, but to her it is real heartbreak, and being told it does not matter can
      make her feel very alone. Teenagers' first loves can hurt as much as any adult's.

  - text: Let her know you are there. Sit with her, listen, and say it makes sense to be this sad. Keep an eye on her over the next few weeks.
    call: best
    why: >-
      Taking her feelings seriously is what helps most. Ordinary comfort, like her favourite food or a walk
      together, helps too. If her low mood lasts, or she talks about harming herself, talk to your GP.

  - text: Leave her alone until she gets over it.
    call: okay
    why: >-
      Teenagers do need some space, and that is fine. But completely leaving her can feel like nobody
      notices. Knock, offer a cup of tea, and let her decide how much she wants to talk.

  - text: Message the ex-boyfriend's parents to complain.
    call: risky
    why: >-
      Breakups are a normal, painful part of growing up, and getting involved can embarrass her badly. Unless
      there was something harmful in the relationship, this is hers to work through, with your support.

principle: >-
  First heartbreak is real heartbreak. Take it seriously, listen more than you advise, and keep an eye on
  how they are coping over the following weeks.

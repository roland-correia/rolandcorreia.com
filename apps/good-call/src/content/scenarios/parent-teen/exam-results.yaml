set: parent-teen
category: growing
order: 2
title: Results day
topic: Disappointment
draft: false

situation: |
  Your sixteen-year-old, Noah, opens his GCSE results. He has done less well than he hoped in maths and English, and is crying in the car park.

question: What is the best call?

options:
  - text: Tell him he should have revised more.
    call: risky
    why: >-
      He knows. Saying it now, while he is upset, adds shame and does not help him decide what to do next.
      Support first. Reflection on revision can come much later, if at all.

  - text: Hug him, tell him you are proud of him whatever the grades, and then, when he is ready, look together at his options, including resits and talking to the school or college.
    call: best
    why: >-
      Your love not depending on grades is what he most needs to hear today. Then the practical part: there
      are almost always options, including resits. Schools and colleges help with this every summer.

  - text: Compare him with his cousin, who did really well.
    call: risky
    why: >-
      Comparison is painful at the best of times, and devastating on a bad day. It tells him his worth is
      measured against others. He needs to know he is valued for who he is.

  - text: Say the grades do not matter at all.
    call: okay
    why: >-
      It comes from love, and grades are certainly not everything. But they may matter for his plans, and he
      may feel his disappointment is being brushed aside. Acknowledge it, then look at the options.

principle: >-
  On results day, lead with love, not grades. Disappointment is real, and so are the options. Look at them
  together when they are ready.

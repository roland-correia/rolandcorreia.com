set: parent-you
category: repair
order: 3
title: Late again
topic: Co-parenting after separation
draft: false

situation: |
  You and your ex-partner separated a year ago. Your son, Theo, who is eight, lives with you and sees his dad every other weekend. For the third time this month his dad is an hour late for pick-up. Theo is waiting by the window with his bag.

  He asks, "Why is Dad always late?"

question: What is the best call?

options:
  - text: Say, "Because your dad doesn't care enough to be on time."
    call: risky
    why: >-
      Your frustration is completely fair, but Theo hears that his dad does not care about him. Children need
      to be free to love both parents. Criticising one of them in front of a child hurts the child most.

  - text: Say, "I don't know, love, but he's on his way." Keep Theo busy. Later, raise the lateness with his dad directly, out of Theo's hearing.
    call: best
    why: >-
      Theo is protected from the conflict, and the problem still gets raised with the person who can fix it.
      If you cannot agree, family mediation can help separated parents make arrangements that work.

  - text: Text his dad an angry message while Theo watches.
    call: risky
    why: >-
      You are right to raise it, but Theo can see your anger, and it puts him in the middle. Wait until you are
      calm, and he is not there.

  - text: Cancel the visit, to teach his dad a lesson.
    call: risky
    why: >-
      It may feel fair, but it is Theo who loses time with his dad, and it uses him to punish the other
      parent. Unless there is a safety concern, keep the arrangement and deal with the lateness separately.

principle: >-
  After a separation, protect children from adult conflict. Never criticise the other parent in front of
  them, and never use them to send messages. Raise problems directly, adult to adult.

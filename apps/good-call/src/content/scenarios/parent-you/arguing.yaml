set: parent-you
order: 3
title: In front of the children
topic: Conflict between adults
draft: false

situation: |
  You and your partner, Jordan, are arguing about money in the kitchen. Voices are rising. You notice your two children, aged five and nine, standing silently at the door.

question: What is the best call?

options:
  - text: Carry on. It is important to sort it out now.
    call: risky
    why: >-
      It may feel urgent, but children who see adults shouting at each other often feel frightened, or
      believe it is their fault. The argument can wait. Their sense of safety cannot.

  - text: Stop. Say calmly, "We're having a disagreement, and we'll sort it out. It's nothing to do with you." Then finish it later, out of earshot.
    call: best
    why: >-
      You have reassured them, taken the heat out of the moment and kept the issue for later. It is fine for
      children to see calm disagreement and making up. It is shouting and unresolved anger that worry them.

  - text: Ask the nine-year-old whose side they are on.
    call: risky
    why: >-
      Children should never be asked to take sides between the adults who care for them. It puts them in an
      impossible position and makes them responsible for adult problems.

  - text: Pretend nothing happened, and never mention it.
    call: okay
    why: >-
      Ending the argument is good. But they saw it, and silence can leave them worrying. A brief, calm word
      that it is sorted helps them feel safe again.

principle: >-
  Children are not harmed by seeing adults disagree calmly and make up. Shouting, contempt and being asked to
  take sides do harm them. Keep big arguments away from them, and reassure them afterwards.

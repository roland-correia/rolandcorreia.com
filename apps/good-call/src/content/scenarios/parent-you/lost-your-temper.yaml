set: parent-you
category: repair
order: 1
title: You shouted
topic: Repair after a bad moment
draft: false

situation: |
  After a long day, your seven-year-old, Mila, knocked a full drink over the laptop. You shouted at her, much louder than you meant to, and she ran upstairs crying.

  You feel awful.

question: What is the best call for you?

options:
  - text: Leave it, and act normally tomorrow so that it is forgotten.
    call: okay
    why: >-
      Moving on is natural. But children remember moments like this, and without a repair she may decide that
      she is the problem. A short apology tonight helps her, and teaches her how to put things right.

  - text: Calm down, then go to her. "I'm sorry I shouted. I was upset about the laptop, but shouting wasn't OK. It was an accident, and I love you."
    call: best
    why: >-
      Every parent loses their temper sometimes. What matters most is the repair. Apologising shows her that
      adults make mistakes and take responsibility, which is exactly what you want her to learn.

  - text: Tell her it was her fault for being careless.
    call: risky
    why: >-
      She did knock the drink over, but she did not choose to, and she was not responsible for your shouting.
      Blaming her teaches her that adults' anger is children's fault.

  - text: Decide you are a terrible parent.
    call: okay
    why: >-
      Feeling bad shows how much you care. But one bad moment does not make a bad parent, and self-blame does
      not help Mila. A repair does. If it happens often, think about what support would help you.

principle: >-
  Every parent loses their temper sometimes. The repair is what counts: calm down, say sorry, explain, and
  reassure. It teaches children how to put things right.

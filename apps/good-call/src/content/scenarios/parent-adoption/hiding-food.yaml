set: parent-adoption
order: 4
title: Food in the wardrobe
topic: Early trauma
draft: false

situation: |
  Your foster son, Rio, is seven. He came to you six months ago after a time of neglect. You keep finding food hidden in his wardrobe and under his bed, even though he always has enough to eat.

question: What is the best call?

options:
  - text: Tell him firmly that stealing food is wrong, and punish him.
    call: risky
    why: >-
      Hiding food is very common in children who have gone hungry. It is a survival habit, not bad behaviour.
      Punishing it confirms his fear that food is not safe, which makes the hiding worse.

  - text: Reassure him that there will always be food, give him a snack box he is allowed to keep in his room, and talk to his social worker about support.
    call: best
    why: >-
      Meeting the need behind the behaviour helps it fade. A box of his own, topped up reliably, shows him
      that food is safe here. His social worker can arrange specialist support if he needs it.

  - text: Lock the kitchen cupboards.
    call: okay
    why: >-
      You may need to protect some foods for health or safety. But locking everything away can feel like a
      sign that food is scarce again. Reliable access to some food works better.

  - text: Ignore it, and hope he grows out of it.
    call: okay
    why: >-
      Not making it a big deal is good. But hidden food can go off and attract pests, and the worry behind it
      needs gentle reassurance. Speak to him about it calmly.

principle: >-
  Behaviour that comes from early trauma or neglect needs understanding and support, not only consequences.
  Look for the need behind it, and ask for specialist help early.

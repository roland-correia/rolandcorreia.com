set: parent-adoption
category: identity
order: 1
title: When do we tell her?
topic: Their story
draft: false

situation: |
  You and your wife adopted your daughter, Lola, when she was a baby. She is now three. A relative says, "Wait until she's older to tell her she's adopted. Why upset her now?"

question: What is the best call?

options:
  - text: Wait until she is a teenager and can understand properly.
    call: risky
    why: >-
      Adopted people who find out late often describe it as a shock that shakes their trust in everything
      they were told. Hearing it for the first time as a teenager, at an age when identity matters most, is especially hard.

  - text: Start now, in simple words, as part of everyday life. "We were so happy when you came to live with us." Add more detail as she grows.
    call: best
    why: >-
      Adoption agencies advise telling children from the start, so that they never remember a time of not
      knowing. Simple words now, and more as she grows, often with a life story book, make it part of who she is, not a secret.

  - text: Tell her everything at once, including the difficult parts of her history.
    call: okay
    why: >-
      Honesty is right. But a three-year-old cannot take in everything, and some parts of a child's history
      need to be shared gradually, as they are able to understand. Your agency can help you plan what to say, and when.

  - text: Wait until she asks.
    call: okay
    why: >-
      Many children do ask, and following their lead is good. But some never ask, because they sense it is a
      difficult subject. Bring it up yourself, so that she knows it is always OK to talk about.

principle: >-
  Children should never discover they were adopted. Tell them early, in simple words, and keep the story
  going as they grow. It should always be safe to talk about.

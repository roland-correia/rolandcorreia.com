set: parent-adoption
category: belonging
order: 2
title: Why can't I live with Mum?
topic: Kinship care
draft: false

situation: |
  You are raising your grandson, Jack, who is six, because his mum, your daughter, cannot look after him at the moment. She struggles with addiction. Jack asks, "Why can't I live with my mum?"

  You are angry with your daughter, and heartbroken.

question: What is the best call?

options:
  - text: Tell him his mum chose drugs over him.
    call: risky
    why: >-
      Your anger is understandable. But Jack may hear that he was not worth staying for, or that he will turn
      out like her. Children need to love their parents, even ones who cannot care for them.

  - text: Say, simply and gently, "Mummy has an illness that makes it hard for her to look after you right now. It isn't your fault. I'm looking after you, and I always will."
    call: best
    why: >-
      It is honest, at a level he can understand, and it tells him the two most important things: it is not
      his fault, and he is safe with you. You can share more as he grows. Charities such as Kinship support grandparents in this position.

  - text: Tell him his mum is working far away.
    call: risky
    why: >-
      It protects him now but leaves him confused when she does not come back, and he may stop trusting you
      when he learns the truth. A simple, honest version is safer.

  - text: Change the subject, because he is too young.
    call: okay
    why: >-
      You are trying to protect him, and you do not have to say everything at once. But he will keep wondering,
      and may fill the gap with self-blame. A short, honest answer helps him more than silence.

principle: >-
  Tell children the truth about why they are with you, at a level they can understand. Never speak badly of
  their parents in front of them, and always make clear it is not their fault.

set: parent-adoption
category: identity
order: 3
title: A message from her birth mum
topic: Birth family contact
draft: false

situation: |
  Your adopted daughter, Kelsey, is fourteen. She shows you a message on social media from someone who says she is Kelsey's birth mother. She asks to meet. Kelsey is excited and scared. There is no contact arrangement in place.

question: What is the best call?

options:
  - text: Thank Kelsey for showing you, tell her you understand why she wants to know more, and ask her not to reply yet. Then contact your adoption agency or local authority for advice.
    call: best
    why: >-
      Unplanned contact through social media can be overwhelming and sometimes unsafe. Agencies help families
      with exactly this, and can check who the person is and plan any contact carefully, at Kelsey's pace.

  - text: Block the account and forbid Kelsey from ever being in touch.
    call: risky
    why: >-
      It is natural to want to protect her, but banning contact outright can drive it underground, where you
      cannot help her. Her wish to know her birth family is normal and healthy.

  - text: Let her meet straight away, since she wants to.
    call: risky
    why: >-
      Her wish matters, but a first meeting with no preparation, support or checks can be overwhelming for a
      fourteen-year-old, and you do not yet know who the message is from. Take advice first.

  - text: Reply yourself, pretending to be Kelsey, to find out more.
    call: risky
    why: >-
      Deceiving the person, even to protect Kelsey, can backfire badly and damage trust on both sides. Leave
      checking and contact to the professionals.

principle: >-
  A child's curiosity about their birth family is normal and healthy. If unexpected contact arrives, stay calm,
  thank them for telling you, and get advice before anyone replies.

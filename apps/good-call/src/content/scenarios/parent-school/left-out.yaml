set: parent-school
order: 1
title: Nobody would play with me
topic: Friendships and bullying
draft: false

situation: |
  Your eight-year-old, Priya, comes home quiet. At bedtime she tells you that for two weeks a group of girls have been telling her she cannot play with them, and laughing when she walks past.

  She begs you not to tell the school, because "it'll make it worse".

question: What is the best call?

options:
  - text: Listen to the whole story, thank her for telling you, and agree together how to tell her teacher. Then keep checking in.
    call: best
    why: >-
      Being listened to first matters most. Two weeks of being shut out is bullying, and schools have a duty
      to deal with it. Planning it with her, such as what you will say and when, respects her fear and still gets help.

  - text: Promise not to tell anyone.
    call: risky
    why: >-
      Her fear is real, but a promise you cannot keep will hurt her trust later. Bullying rarely stops by
      itself. Tell her you will only share what is needed, with the people who can help.

  - text: Message the other girls' parents tonight.
    call: okay
    why: >-
      Wanting to act quickly is natural. But messages between parents often turn into arguments, and can make
      things harder for Priya at school. The school is better placed to deal with it fairly.

  - text: Tell her to ignore them and find other friends.
    call: okay
    why: >-
      Encouraging other friendships can help, and it is useful advice. But on its own it leaves an
      eight-year-old to solve bullying herself. She needs adults to act as well.

principle: >-
  When your child tells you about bullying, listen to everything first, stay calm, and agree a plan with
  them. Then work with the school, and keep checking in.

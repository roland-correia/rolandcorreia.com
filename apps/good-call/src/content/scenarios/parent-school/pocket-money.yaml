set: parent-school
category: values
order: 3
title: Jobs and pocket money
topic: Responsibility
draft: false

situation: |
  Your nine-year-old, Lily, asks for pocket money because her friends get it. You would like her to help more at home, but you are not sure whether to pay her for jobs.

question: What is the best call?

options:
  - text: Pay her for every job she does, so she learns that money is earned.
    call: okay
    why: >-
      Earning money for extra jobs can teach a lot. But if every job is paid, she may refuse to help when she
      does not want the money. Some jobs are simply part of living together.

  - text: Agree a few everyday jobs she does as part of the family, and give a small, regular pocket money amount. Help her save some and decide how to spend the rest.
    call: best
    why: >-
      She learns both lessons: everyone helps at home, and money needs managing. Making her own choices,
      including mistakes, with small amounts, is how children learn to handle money.

  - text: Give her money whenever she asks.
    call: risky
    why: >-
      It keeps her happy now, but she learns nothing about planning or saving, and money becomes something
      that simply appears. A regular, small amount teaches far more.

  - text: Refuse, because she is too young to manage money.
    call: okay
    why: >-
      It is your decision, but nine is a good age to start learning about money with small amounts, while
      mistakes are cheap. Learning now saves bigger mistakes later.

principle: >-
  Children learn responsibility by having some. Everyday jobs are part of family life, and a small, regular
  amount of money teaches saving, choosing and planning.

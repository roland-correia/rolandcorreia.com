set: parent-school
order: 5
title: Already?
topic: Puberty
draft: false

situation: |
  Your daughter Hana is nine. You notice the first signs of puberty: she is developing breasts and needs deodorant. You had planned to talk about periods "when she's older".

question: What is the best call?

options:
  - text: Wait until her first period, then explain everything.
    call: risky
    why: >-
      Many girls start their periods between ten and twelve, and some earlier. Starting without knowing what
      is happening can be frightening. The talk is best before it happens, not after.

  - text: Start talking now, simply and in stages, about what will change and why. Keep pads in the house, and in her school bag.
    call: best
    why: >-
      Talking early, in small conversations instead of one big one, makes it ordinary. Being prepared, with
      pads and a plan, means her first period is not a crisis. Boys need these talks too, about their own changes and about periods.

  - text: Leave it to the school's lessons.
    call: okay
    why: >-
      School lessons help, but they may come later than she needs, and they cannot answer her private
      questions. She needs to know she can talk to you about her body.

  - text: Give her a book and tell her to read it.
    call: okay
    why: >-
      A good book is a great help, and some children prefer to read first. Give it with a conversation, and
      make sure she knows she can come to you with questions.

principle: >-
  Talk about puberty before it starts, in small, calm conversations. For some children that is eight or nine.
  Being prepared turns a frightening moment into an expected one.

set: parent-newborn
category: safety
order: 5
title: Everyone wants a cuddle
topic: Visitors and germs
draft: false

situation: |
  Your daughter, Esme, is two weeks old. Your cousin arrives for a visit with a streaming cold and a cold sore on her lip, and goes straight to pick Esme up and kiss her face.

  You do not want to offend her.

question: What is the best call?

options:
  - text: Let her. It would be rude to say anything.
    call: risky
    why: >-
      Newborns' immune systems are still developing, and the virus that causes cold sores can make a young
      baby seriously ill. Protecting your baby is not rude. It is your job.

  - text: Say warmly, "We're not letting anyone with a cold or a cold sore hold her yet. Come and see her, and have a cuddle next time." Ask visitors to wash their hands.
    call: best
    why: >-
      It is kind and clear, and it is about the baby, not the visitor. Most people understand. Asking
      everyone to wash their hands, and not to kiss a newborn's face, is a reasonable house rule.

  - text: Let her hold Esme, but ask her not to kiss her.
    call: okay
    why: >-
      Asking her not to kiss the baby helps, and it is better than nothing. But with a cold and a cold sore,
      holding her close is still a risk. It is fine to ask her to wait until she is well.

  - text: Cancel all visitors for the first three months.
    call: okay
    why: >-
      It is your decision, and some families prefer a quiet start. But company and help can be good for new
      parents. Healthy visitors who wash their hands are usually fine. Ask unwell ones to wait.

principle: >-
  You are allowed to set rules to protect a newborn: wash hands, no kisses on the face, and no visits when
  someone is unwell. Say it kindly, and say it early.

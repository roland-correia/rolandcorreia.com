set: parent-newborn
order: 3
title: A high temperature
topic: When a baby is unwell
draft: false

situation: |
  Your seven-week-old, Zain, feels hot and is feeding less than usual. You take his temperature. It is 38.2C.

  It is Saturday evening and the GP surgery is closed. Your mum says, "Babies get temperatures. Give it till Monday."

question: What is the best call?

options:
  - text: Wait until Monday and call the GP then.
    call: risky
    why: >-
      For babies under 3 months, the NHS says a temperature of 38C or higher needs advice the same day. Young
      babies can become seriously ill quickly, and a fever may be the only early sign. Waiting two days is too long.

  - text: Call NHS 111 now, and follow their advice. Call 999 if he becomes floppy, hard to wake or has trouble breathing.
    call: best
    why: >-
      This is exactly what 111 is for, and it is what the NHS advises at this age. They may well tell you he
      needs to be seen tonight. Nobody will think you are fussing. Calling is the right call with a baby this young.

  - text: Give him some infant paracetamol and see whether it comes down.
    call: okay
    why: >-
      Bringing a temperature down can make a baby more comfortable, but it does not tell you why it is high,
      and medicine doses for very young babies need checking. Get advice from 111 first. They can tell you what to give.

  - text: Search online for his symptoms.
    call: okay
    why: >-
      It is natural to look things up, and NHS pages are reliable. But a search cannot examine your baby or
      ask you the right questions. With a baby under 3 months, speak to someone.

principle: >-
  Under 3 months, a temperature of 38C or higher is a reason to call NHS 111 the same day. Trust your instinct:
  if your baby seems unwell, you are never wasting anyone's time.

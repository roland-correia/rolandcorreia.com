set: parent-newborn
category: care
order: 2
title: The first vaccinations
topic: Health checks
draft: false

situation: |
  Your baby's first vaccinations are due at 8 weeks. You have read frightening posts online about vaccines, and you hate the thought of the needle hurting her. Part of you wants to cancel.

question: What is the best call?

options:
  - text: Cancel the appointment, just in case.
    call: risky
    why: >-
      The vaccines at 8 weeks protect against serious illnesses such as whooping cough, meningitis and
      rotavirus, which are most dangerous to young babies. Delaying leaves her unprotected when she is most at risk.

  - text: Take your questions to the appointment, or ask your GP or health visitor beforehand, and use NHS information instead of social media.
    call: best
    why: >-
      Your worries deserve real answers, and the people giving the vaccines are there to answer them. The NHS
      vaccination pages explain what each one is for. Feeding or cuddling her straight afterwards helps with the pain.

  - text: Go ahead, but say nothing about your worries.
    call: okay
    why: >-
      Getting her protected is the important part. But you will be back for more vaccines at 12 and 16 weeks,
      and unanswered worries tend to grow. Ask your questions. Nobody will think less of you.

  - text: Wait until she is older and less likely to feel it.
    call: risky
    why: >-
      The schedule is timed to protect babies before they meet these illnesses, so waiting removes that
      protection when she needs it most. A quick cry and a cuddle are a small price.

principle: >-
  Take worries about your child's health to people who can answer them: your GP, health visitor or the NHS
  website. Health checks and vaccinations are scheduled to protect them when they are most at risk.

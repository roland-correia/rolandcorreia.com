set: parent-newborn
order: 2
title: Asleep on you
topic: Safer sleep
draft: false

situation: |
  Your three-week-old daughter, Ava, has finally fallen asleep on your chest after a long evening feed. You are on the sofa, and you have barely slept in days. Your eyes keep closing.

  If you move her, she might wake up.

question: What is the best call?

options:
  - text: Stay as you are. You will just rest your eyes for a few minutes.
    call: risky
    why: >-
      Falling asleep on a sofa or armchair with a baby is one of the most dangerous sleep situations there is.
      A baby can slip into a gap or against you and be unable to breathe. Tiredness is exactly why "a few minutes" becomes an hour.

  - text: Move her to her cot, on her back, even if she might wake.
    call: best
    why: >-
      Every sleep, day or night, is safest on their back in their own clear cot. If she wakes, you can settle
      her again. That is a much better problem than the alternative. Then get some sleep yourself.

  - text: Take her into your bed so you can both sleep properly.
    call: okay
    why: >-
      Many families share a bed, and a bed is far safer than a sofa. But it needs preparing: a firm mattress,
      no pillows or duvet near her, and never after alcohol, smoking or medication that makes you drowsy.
      Moving her to her cot is simpler and safer tonight.

  - text: Prop yourself up with cushions so that you cannot slump.
    call: risky
    why: >-
      Cushions make the sofa more dangerous, not less, because they add soft surfaces a baby can be pressed
      against. If you feel sleepy while holding her, the only safe move is to put her down.

principle: >-
  On their back, in their own clear cot, for every sleep. Never fall asleep with a baby on a sofa or
  armchair. If you feel yourself drifting off while holding them, put them down.

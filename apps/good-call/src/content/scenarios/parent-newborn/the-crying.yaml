set: parent-newborn
order: 1
title: Three hours of crying
topic: Coping with crying
draft: false

situation: |
  It is 2am. Your five-week-old son, Noah, has been crying on and off for three hours. He has been fed, winded and changed, and he is not too hot or too cold. You have rocked him, walked him and sung to him.

  You are exhausted, your hands are shaking, and you can feel yourself getting angry.

question: What is the best call?

options:
  - text: Keep jiggling and bouncing him, harder and faster, until he stops.
    call: risky
    why: >-
      When you are this tired and frustrated, movements can get rougher than you intend. A baby's neck is too
      weak to support their head, and shaking can cause serious brain damage. The feeling you have is the
      signal to step away, not to try harder.

  - text: Put Noah down safely on his back in his cot, close the door, and take ten minutes to calm down. Then go back to him.
    call: best
    why: >-
      This is what health visitors advise, and it is always OK. A baby crying in a safe cot for ten minutes
      will come to no harm. A calmer you is safer and better at soothing. If you are worried he is unwell, call NHS 111.

  - text: Wake your partner, or phone someone you trust, and hand over for a while.
    call: okay
    why: >-
      Asking for help is a good instinct, and if someone is there to take over, do it. But if nobody is, or
      you feel close to losing control right now, put him down safely first and step away. Then call.

  - text: Leave him crying and go back to bed with earplugs in until morning.
    call: risky
    why: >-
      A short break is fine. Hours without checking on a newborn is not, because crying can sometimes be a
      sign of illness that needs attention. Take ten minutes to reset, then go back and check on him.

principle: >-
  Crying is normal, and it can push anyone to the edge. It is always OK to put your baby down safely and walk
  away for a few minutes. Never shake a baby, however frustrated you feel.

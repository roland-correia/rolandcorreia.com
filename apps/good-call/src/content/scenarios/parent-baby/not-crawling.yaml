set: parent-baby
category: growing
order: 1
title: Everyone else's baby
topic: Comparing milestones
draft: false

situation: |
  At baby group, everyone's babies seem to be crawling, and one is pulling up to stand. Your eleven-month-old, Sami, sits happily and shuffles on his bottom, but does not crawl. Another parent asks whether you are worried.

  Now you are.

question: What is the best call?

options:
  - text: Practise crawling with him every day until he does it.
    call: okay
    why: >-
      Floor time and play help all babies develop, so encouraging him is good. But babies reach milestones at
      different ages, and some never crawl at all. Pushing hard can make it stressful for both of you.

  - text: Remember that babies develop at different rates. Give him plenty of floor time, and mention it to your health visitor, who can check his development.
    call: best
    why: >-
      There is a wide normal range, and many bottom-shufflers walk without ever crawling. Health visitors
      review development until around age two, and you can ask them any time. They can tell you what to watch for.

  - text: Stop going to baby group so you do not compare.
    call: okay
    why: >-
      Comparison can be painful, and it is fine to take a break. But baby groups give him play and give you
      company. Remind yourself that each baby has their own timetable.

  - text: Search online for everything bottom-shuffling could mean.
    call: risky
    why: >-
      Searching tends to bring up the rarest and most frightening explanations first. A health visitor who
      can actually see Sami will give you a much more accurate picture.

principle: >-
  Babies reach milestones at different ages, and there is a wide normal range. If you are worried about how
  your child is developing, ask your health visitor or GP, not other parents or the internet.

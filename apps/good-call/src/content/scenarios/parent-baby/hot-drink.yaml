set: parent-baby
category: safety
order: 5
title: A cup of tea and a cuddle
topic: Burns and scalds
draft: false

situation: |
  Your friend comes round with her baby. You make tea and sit down on the sofa with your mug in one hand and your nine-month-old son, Kai, on your lap. He keeps reaching for the mug.

question: What is the best call?

options:
  - text: Hold the mug up high, away from him.
    call: okay
    why: >-
      Keeping it out of his reach is better than nothing. But a wriggling baby can knock your arm in an
      instant, and a hot drink can scald a baby's skin badly, even some time after it was made.

  - text: Put the mug down out of reach, at the back of a high surface, before you hold him, and drink it when he is not on your lap.
    call: best
    why: >-
      Never holding a hot drink and a baby at the same time is a simple habit that prevents one of the most
      common serious injuries in young children. Your tea can wait a few minutes.

  - text: Put the mug on the coffee table next to you.
    call: risky
    why: >-
      A low table is well within reach of a crawling or sitting baby. Babies grab, pull tablecloths and knock
      things over before you can react. Hot drinks need to be up high and pushed back.

  - text: Let him touch the side of the mug so he learns it is hot.
    call: risky
    why: >-
      A baby's skin is much thinner than an adult's and burns at lower temperatures. He will not learn a
      lesson from it, only get hurt. Keeping hot things away is the only safe approach.

principle: >-
  Never hold a baby and a hot drink at the same time. Keep hot drinks, kettles and pans up high and pushed
  back. A scald takes a second and can leave scars for life.

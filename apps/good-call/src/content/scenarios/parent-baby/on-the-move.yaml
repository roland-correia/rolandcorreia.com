set: parent-baby
category: safety
order: 4
title: Suddenly crawling
topic: Seeing danger first
draft: false

situation: |
  Your eight-month-old, Ruby, started crawling this week. Yesterday she pulled herself up the first stair while you were in the kitchen. There are cables behind the TV, cleaning products under the sink and a bookcase that wobbles.

question: What is the best call?

options:
  - text: Keep a closer eye on her and deal with each thing as it comes up.
    call: okay
    why: >-
      Watching her is essential, but babies move faster than any parent can react, and you cannot watch every
      second. Removing the most serious hazards now means a moment of distraction does not become an accident.

  - text: Get down to her level and look around for what she could reach, pull or climb. Fit stair gates, fix the bookcase to the wall and move chemicals up high.
    call: best
    why: >-
      Seeing the room from her height is the quickest way to spot danger before she does. Stair gates,
      secured furniture and locked or high storage prevent the most common serious injuries at this age.

  - text: Keep her in a playpen or bouncer most of the day.
    call: okay
    why: >-
      A safe space is useful when you need to do something else. But crawling is how she builds strength and
      learns. She needs time on the floor in a space that has been made safe.

  - text: Leave things as they are. She needs to learn what is dangerous.
    call: risky
    why: >-
      A baby cannot learn that a falling bookcase or a cleaning product is dangerous. The first lesson could
      be a serious injury. At this age, keeping her safe is the adult's job.

principle: >-
  Babies move before you expect them to. Look at your home from their height, and deal with the hazards
  before they find them: stairs, furniture that can tip, chemicals and cables.

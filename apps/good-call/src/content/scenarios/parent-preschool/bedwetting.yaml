set: parent-preschool
category: growing
order: 2
title: Wet again
topic: Bedwetting
draft: false

situation: |
  Your daughter, Sienna, is four and a half. She has been dry in the day for over a year but still wets the bed most nights. She has started to feel embarrassed and does not want to go to a friend's party sleepover.

question: What is the best call?

options:
  - text: Tell her she is too old for this and needs to try harder.
    call: risky
    why: >-
      Bedwetting is not something children can control by trying. The NHS says it is normal for many
      children under 5. Being told off adds shame and worry, which can make it harder.

  - text: Reassure her it is very common and not her fault. Use waterproof bedding, make sure she goes to the toilet before bed, and see the GP if it is still happening after she turns five.
    call: best
    why: >-
      This keeps it calm and practical. Many children take longer to be dry at night than in the day. If it
      continues past five, or comes back after she has been dry, the GP can help.

  - text: Stop her drinking anything after lunch.
    call: risky
    why: >-
      Cutting down drinks a lot can make children dehydrated and does not usually stop bedwetting. The NHS
      advises regular drinks through the day, and a toilet trip before bed.

  - text: Wake her in the night to go to the toilet.
    call: okay
    why: >-
      Lots of parents try it, and it can mean fewer wet sheets. But the NHS says lifting a sleeping child to
      the toilet does not help in the long term, because it does not teach her body to wake when it needs to.

principle: >-
  Bedwetting is common and is not a child's fault. Keep it calm and practical, never punish it, and talk to
  your GP if it carries on after age five.

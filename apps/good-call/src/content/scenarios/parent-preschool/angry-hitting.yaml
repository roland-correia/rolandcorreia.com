set: parent-preschool
category: feelings
order: 3
title: He hit his sister
topic: Anger
draft: false

situation: |
  Your five-year-old, Reggie, has been building a tower all afternoon. His little sister knocks it down. He screams and hits her, hard.

question: What is the best call?

options:
  - text: Comfort his sister first, then, when he is calmer, say, "You were really angry about your tower. It's OK to be angry. It's not OK to hit." Help him think of what to do next time.
    call: best
    why: >-
      You keep everyone safe, check on the child who was hurt and set a clear limit. Naming his feeling helps
      him understand it, which is the first step to managing it. Ideas like stamping or coming to you give him another way.

  - text: Smack him so he knows how hitting feels.
    call: risky
    why: >-
      It teaches him that hitting is what people do when they are angry, including the adults he trusts. It
      is illegal in Scotland and Wales, and it does not teach him what to do with his anger.

  - text: Tell him it was his sister's fault for knocking it down.
    call: okay
    why: >-
      His anger is understandable, and his sister does need to learn about other people's things. But
      hitting is still not OK, whatever the reason. Both things need saying.

  - text: Send him to his room until he can say sorry.
    call: okay
    why: >-
      Time to calm down can help, and saying sorry matters. But on its own, being sent away can feel like
      punishment for having feelings. Come back and talk about what happened once he is calm.

principle: >-
  All feelings are allowed; not all actions are. Name the feeling, set the limit, and teach another way to
  show anger. Children learn to manage emotions with an adult's help, not alone.

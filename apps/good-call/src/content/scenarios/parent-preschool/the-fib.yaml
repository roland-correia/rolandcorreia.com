set: parent-preschool
order: 2
title: The dog did it
topic: Fibs and honesty
draft: false

situation: |
  You find crayon all over the living room wall. Your four-year-old, Jamal, is holding a red crayon. When you ask what happened, he says, "Biscuit did it." Biscuit is the dog.

question: What is the best call?

options:
  - text: Shout, "Don't lie to me!" and send him to his room.
    call: risky
    why: >-
      Children this age often fib because they are scared of getting into trouble. A big reaction confirms
      that the truth is dangerous, so the next fib becomes more likely, not less.

  - text: Stay calm, and say, "I think you drew on the wall. Walls aren't for drawing. Let's clean it together." Thank him when he does tell the truth.
    call: best
    why: >-
      You have dealt with the real problem, the wall, without making the truth frightening. Cleaning it up
      together is a natural consequence. Praise for honesty, when it comes, teaches more than punishment for a fib.

  - text: Laugh and let it go. It is funny, and he is only four.
    call: okay
    why: >-
      It can be funny, and a fib at four is a sign of a growing imagination, not a moral failing. But he
      still needs to know that walls are not for drawing and that you can see what happened.

  - text: Ask him again and again until he admits it.
    call: okay
    why: >-
      You want honesty, which is right. But questioning him when you already know the answer sets up a test
      he is likely to fail. Say what you saw, and move on to fixing it.

principle: >-
  At this age, fibs usually come from fear or imagination. Make the truth safe to tell. Deal calmly with what
  happened, and notice and praise honesty when you see it.

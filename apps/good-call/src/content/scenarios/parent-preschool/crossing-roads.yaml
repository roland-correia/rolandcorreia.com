set: parent-preschool
category: safety
order: 3
title: Running ahead
topic: Roads
draft: false

situation: |
  Your four-year-old, Arlo, loves running ahead on the way to nursery. Today he dashed to the edge of the kerb before you caught up. He thinks it is a game.

question: What is the best call?

options:
  - text: Tell him off loudly every time, so he learns.
    call: okay
    why: >-
      Your fright is understandable and a firm reaction is reasonable. But shouting does not teach him what
      to do instead, and he may come to think running ahead is a way to get a reaction.

  - text: Agree a clear rule, such as holding hands or the buggy near roads and stopping at every kerb, and practise "stop, look, listen" together on every walk.
    call: best
    why: >-
      Young children cannot judge the speed or distance of traffic, so they need a simple, consistent rule
      and an adult close by. Practising crossing together, every time, builds habits for when they are older.

  - text: Let him run ahead on quiet roads to build his independence.
    call: risky
    why: >-
      At four, children cannot reliably stop, judge traffic or remember a rule when they are excited. Quiet
      roads can still have fast cars. Independence near roads comes later, with practice.

  - text: Use reins or a wrist strap on busy stretches.
    call: okay
    why: >-
      Reins are a good safety tool for a child who runs, especially near busy roads. Use them alongside
      teaching the rule, so he learns to stop by himself as he grows.

principle: >-
  Young children cannot judge traffic. Keep them close, hold hands near roads, and practise "stop, look,
  listen" together on every walk, so the habit is there when they are older.

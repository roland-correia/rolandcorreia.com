set: parent-preschool
category: feelings
order: 2
title: I don't want to go to school
topic: Starting school
draft: false

situation: |
  Your son Kai starts Reception in two weeks. Every time it comes up, he says he does not want to go, clings to you and cries. You are anxious about it yourself.

question: What is the best call?

options:
  - text: Tell him he has to go and there is nothing to worry about, then stop talking about it.
    call: okay
    why: >-
      Reassurance is kind, and school is not optional. But telling a child not to worry does not stop the
      worry. He needs to know what to expect, and that his feelings make sense.

  - text: Talk about what school will be like, visit or walk past it, read stories about starting school, and say it is OK to feel nervous.
    call: best
    why: >-
      Most fear of something new is fear of the unknown. Making school familiar, through visits, stories and
      routines, takes away much of it. Naming his feelings tells him they are normal and that you are with him.

  - text: Share your own worries with him, so he knows he is not alone.
    call: risky
    why: >-
      Your feelings are valid, but children pick up their parents' anxiety and take it on. Talk to another
      adult about your worries, and show Kai calm confidence, even if you have to practise it.

  - text: Ask the school whether he can start later.
    call: okay
    why: >-
      In England, children do not have to be in full-time education until the term after they turn five, so
      this can be an option. But nerves before starting are very common. Talk to the school about how they help children settle first.

principle: >-
  Fear of starting school is mostly fear of the unknown. Make it familiar, name the feeling, and stay calm
  yourself. Most children settle within a few weeks.

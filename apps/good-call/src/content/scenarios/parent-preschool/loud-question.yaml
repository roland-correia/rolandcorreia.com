set: parent-preschool
order: 1
title: Why is that man like that?
topic: Questions in public
draft: false

situation: |
  On the bus, your four-year-old, Sophie, points at a man using a wheelchair and asks very loudly, "Why can't that man walk? What's wrong with him?"

  The man can hear.

question: What is the best call?

options:
  - text: Shush her sharply and tell her it is rude to stare.
    call: risky
    why: >-
      She asked because she is curious, not to be unkind. Shushing teaches her that disability is something
      shameful that must not be mentioned. The man has probably heard that message many times.

  - text: Answer simply and kindly. "His legs work differently, so he uses a wheelchair to get around. Lots of people do." If he joins in, follow his lead.
    call: best
    why: >-
      A plain, matter-of-fact answer treats difference as ordinary, which is what you want her to learn. It
      also treats him as a person in the conversation. Many disabled people would much rather that than an awkward silence.

  - text: Pretend you did not hear her and look out of the window.
    call: okay
    why: >-
      Avoiding embarrassment is understandable. But she will ask again, possibly louder, and silence also
      teaches that this is not something people talk about. A short, calm answer works better.

  - text: Apologise to the man for her.
    call: okay
    why: >-
      You mean well, and a smile can help. But apologising can suggest that his being there is the problem.
      Answer her question kindly, and if he seems happy to chat, let him.

principle: >-
  Young children ask about differences out loud. Answer simply, truthfully and kindly. The way you answer
  teaches them whether difference is shameful or ordinary.
